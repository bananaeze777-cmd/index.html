<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Live Score</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&display=swap" rel="stylesheet"><style>*{font-family:'Kanit'}body{margin:0;background:#0a1230;color:white}#h{text-align:center;padding:16px}h1{margin:0}#s{text-align:center;font-size:12px;background:rgba(255,255,255,.15);width:fit-content;margin:8px auto;padding:6px 12px;border-radius:20px}.grid{max-width:700px;margin:0 auto;padding:12px}.card{background:rgba(255,255,255,.1);border-radius:16px;padding:14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center}.team{display:flex;align-items:center;gap:8px;position:relative}.team.w .logo{box-shadow:0 0 0 3px gold}.logo{width:28px;height:28px;border-radius:50%;background:white;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.crown{position:absolute;top:-14px;left:-4px;display:none}.team.w .crown{display:block;animation:spin 2s linear infinite}@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}.score{font-weight:800}</style></head><body><div id="h"><h1 id="t">FOOTBALL LIVE</h1><div id="d" style="opacity:.7;font-size:12px"></div></div><div id="s">กำลังดึง...</div><div class="grid" id="g"></div><script>
const YEAR=new Date().getFullYear();document.getElementById('t').innerText=`FOOTBALL LIVE SCORE ${YEAR}`;document.getElementById('d').innerText=`ปี ${YEAR} อัปเดตสด - ze777-cmd.github.io`;
async function load(){const today=new Date().toISOString().slice(0,10).replace(/-/g,'');document.getElementById('s').innerText=`⏳ ดึงสกอร์ ${today.slice(0,4)}-${today.slice(4,6)}-${today.slice(6,8)} ปี ${YEAR}...`;try{let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${today}`);let j=await r.json();if(!j.events||j.events.length==0){let y=new Date(Date.now()-86400000).toISOString().slice(0,10).replace(/-/g,'');r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${y}`);j=await r.json();document.getElementById('s').innerText=`✅ สกอร์ล่าสุดเมื่อวาน ปี ${YEAR} - ${j.events.length} คู่ (วันนี้ยังไม่มีแข่ง)`}else{document.getElementById('s').innerText=`✅ สกอร์สดวันนี้ ปี ${YEAR} - ${j.events.length} คู่ ตรงกับ Google/Siamsport`;}let h='';j.events.slice(0,20).forEach(ev=>{const c=ev.competitions[0];const hm=c.competitors[0],aw=c.competitors[1];const hw=parseInt(hm.score)>parseInt(aw.score),aww=parseInt(aw.score)>parseInt(hm.score);h+=`<div class="card"><div class="row"><div class="team ${hw?'w':''}"><div class="crown">👑</div><div class="logo"><img src="${hm.team.logo}" onerror="this.style.display='none'"></div>${hm.team.displayName}</div><div class="score">${hm.score} - ${aw.score}</div><div class="team ${aww?'w':''}">${aw.team.displayName}<div class="logo"><img src="${aw.team.logo}"></div><div class="crown">👑</div></div></div><div style="opacity:.5;font-size:11px;margin-top:6px">${ev.name} • ${c.status.type.shortDetail}</div></div>`});document.getElementById('g').innerHTML=h;}catch(e){document.getElementById('s').innerText=`❌ ดึงไม่ได้ - ลองรีเฟรชใหม่ ปี ${YEAR}`}}load();setInterval(load,60000);
</script></body></html>
