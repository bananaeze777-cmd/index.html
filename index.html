<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup Live - Stadium Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Kanit'; box-sizing:border-box}
body{margin:0; min-height:100vh; background:#020510; color:white; overflow-x:hidden; position:relative;}
/* พื้นหลังสนามบอล */
#stadiumBg{position:fixed; inset:0; z-index:-1; background: 
  radial-gradient(ellipse at 50% -10%, rgba(0,255,120,0.15) 0%, transparent 60%),
  radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.25) 0%, transparent 20%),
  radial-gradient(ellipse at 80% 10%, rgba(255,255,255,0.25) 0%, transparent 20%),
  linear-gradient(180deg, #0a1430 0%, #050a1a 40%, #021008 100%);
}
#stadiumBg::before{content:''; position:absolute; bottom:0; left:0; right:0; height:55%; background: 
  repeating-linear-gradient(90deg, rgba(0,255,100,0.07) 0px, rgba(0,255,100,0.07) 80px, rgba(0,255,100,0.04) 80px, rgba(0,255,100,0.04) 160px),
  linear-gradient(180deg, transparent 0%, rgba(0,80,30,0.3) 100%); filter:blur(0.5px);}
#stadiumBg::after{content:''; position:absolute; top:0; left:0; right:0; height:40%; background:linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);}

.spotlight{position:absolute; top:-10%; width:35%; height:120%; background:linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 70%); transform:rotate(15deg); filter:blur(12px); animation: lightMove 8s ease-in-out infinite;}
.spotlight.s2{left:50%; transform:rotate(-15deg); animation-delay:2s}
@keyframes lightMove{0%,100%{opacity:0.6; transform:rotate(15deg) translateX(0)}50%{opacity:1; transform:rotate(15deg) translateX(20px)}}

h1{text-align:center; font-size:36px; margin:24px 0 4px; text-shadow:0 0 20px rgba(0,255,120,0.6), 0 4px 0 #000}
.sub{text-align:center; opacity:0.7; font-size:13px; margin-bottom:24px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:20px; max-width:1200px; margin:0 auto; padding:0 16px 40px}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04)); border:1px solid rgba(255,255,255,0.15); border-radius:28px; padding:22px; backdrop-filter:blur(16px); box-shadow:0 12px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2); position:relative; overflow:hidden;}
.card::before{content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);}

.score-row{display:flex; align-items:center; justify-content:space-between; margin-top:16px}
.team{flex:1; text-align:center; position:relative}
.logo{width:72px; height:72px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; margin:0 auto; position:relative; z-index:1; box-shadow:0 8px 20px rgba(0,0,0,0.4)}
.team.winner .logo{box-shadow:0 0 0 4px #ffd700, 0 0 30px rgba(255,215,0,0.8), 0 10px 30px rgba(0,0,0,0.4); animation:winnerPulse 1.5s infinite}
@keyframes winnerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* มงกุฎหมุนรอบตัวเอง */
.crown{position:absolute; top:-28px; left:50%; width:34px; height:34px; margin-left:-17px; font-size:28px; z-index:3; display:none; animation:crownSpin 2s linear infinite, crownFloat 2s ease-in-out infinite; transform-origin:center center; filter:drop-shadow(0 0 8px gold)}
.team.winner .crown{display:block}
@keyframes crownSpin{from{transform:translateX(0) rotateY(0deg)} to{transform:translateX(0) rotateY(360deg)}}
@keyframes crownFloat{0%,100%{top:-28px}50%{top:-34px}}

.team-name{margin-top:10px; font-weight:700}
.goals{font-size:48px; font-weight:800}
.goals.winner{color:#ffd700; text-shadow:0 0 15px rgba(255,215,0,0.8)}
.vs{opacity:0.3; margin:0 8px}
.status{font-size:11px; padding:5px 10px; border-radius:20px; background:rgba(255,255,255,0.12)}
.live{background:#ff1a1a; box-shadow:0 0 10px #ff1a1a; animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>
<div id="stadiumBg"><div class="spotlight"></div><div class="spotlight s2"></div></div>

<h1>🏆 FIFA WORLD CUP 2026</h1>
<div class="sub">LIVE SCORE • ทีมชนะสวมมงกุฎหมุนได้ 👑 • พื้นหลังสนามบอลจริง</div>

<div class="grid" id="grid"></div>

<script>
async function load(){
  const grid=document.getElementById('grid');
  try{
    const res=await fetch('https://worldcupjson.net/matches?by_date=DESC').then(r=>r.json());
    render(res.slice(0,9));
  }catch{
    render([
      {home_team:{name:'Argentina',goals:3}, away_team:{name:'France',goals:3}, winner:'Argentina', status:'FT', datetime:new Date(), venue:'Lusail'},
      {home_team:{name:'Brazil',goals:1}, away_team:{name:'Croatia',goals:2}, winner:'Croatia', status:'FT', datetime:new Date(), venue:'Education City'},
      {home_team:{name:'Japan',goals:2}, away_team:{name:'Spain',goals:1}, winner:'Japan', status:'FT', datetime:new Date(), venue:'Khalifa'},
    ]);
  }
}

function render(matches){
  document.getElementById('grid').innerHTML=matches.map(m=>{
    const hg=m.home_team.goals??0, ag=m.away_team.goals??0;
    const homeWin = m.winner && m.home_team.name.toLowerCase()===m.winner.toLowerCase();
    const awayWin = m.winner && m.away_team.name.toLowerCase()===m.winner.toLowerCase();
    return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; font-size:11px; opacity:0.6"><span>${m.venue||'World Cup'}</span><span class="status ${m.status==='in_progress'?'live':''}">${m.status}</span></div>
      <div class="score-row">
        <div class="team ${homeWin?'winner':''}">
          <div class="crown">👑</div>
          <div class="logo">⚽</div>
          <div class="team-name">${m.home_team.name}</div>
          <div style="font-size:11px; opacity:0.6; margin-top:2px">ยิง ${hg} ลูก</div>
        </div>
        <div style="text-align:center"><div><span class="goals ${homeWin?'winner':''}">${hg}</span><span class="vs">:</span><span class="goals ${awayWin?'winner':''}">${ag}</span></div></div>
        <div class="team ${awayWin?'winner':''}">
          <div class="crown">👑</div>
          <div class="logo">⚽</div>
          <div class="team-name">${m.away_team.name}</div>
          <div style="font-size:11px; opacity:0.6; margin-top:2px">ยิง ${ag} ลูก</div>
        </div>
      </div>
    </div>`;
  }).join('');
}
load();
</script>
</body>
</html>
