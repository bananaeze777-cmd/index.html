<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 - No API Needed</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Kanit';box-sizing:border-box}
body{margin:0; min-height:100vh; background:#020510; color:white}
#bg{position:fixed; inset:0; z-index:-1; background:radial-gradient(ellipse at 50% -10%, rgba(0,255,120,.18) 0%, transparent 60%), linear-gradient(180deg,#0a1430 0%,#021008 100%)}
h1{text-align:center; font-size:34px; margin:20px 0 4px}
.sub{text-align:center; opacity:.7; font-size:12px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(350px,1fr)); gap:16px; max-width:1100px; margin:16px auto; padding:0 16px 40px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.15); border-radius:26px; padding:18px; backdrop-filter:blur(12px)}
.score-row{display:flex; align-items:center; justify-content:space-between; margin-top:12px}
.team{flex:1; text-align:center; position:relative}
.logo{width:74px; height:74px; border-radius:50%; background:white; margin:0 auto; overflow:hidden; display:flex; align-items:center; justify-content:center}
.logo img{width:100%; height:100%; object-fit:cover}
.team.winner .logo{box-shadow:0 0 0 4px #ffd700, 0 0 25px gold}
.crown{position:absolute; top:-32px; left:50%; margin-left:-16px; font-size:30px; display:none; animation:spin 2s linear infinite, float 2s ease-in-out infinite; filter:drop-shadow(0 0 8px gold)}
.team.winner .crown{display:block}
@keyframes spin{from{transform:rotateY(0)} to{transform:rotateY(360deg)}}
@keyframes float{0%,100%{top:-32px}50%{top:-38px}}
.goals{font-size:48px; font-weight:800}
.goals.winner{color:#ffd700; text-shadow:0 0 15px gold}
</style>
</head>
<body>
<div id="bg"></div>
<h1>🏆 FIFA WORLD CUP 2026</h1>
<div class="sub">เวอร์ชั่น GitHub Pages 100% ไม่ต้องต่อ API - โลโก้ขึ้นครบ มงกุฎหมุน 👑</div>
<div class="grid" id="grid"></div>

<script>
const MATCHES = [
  {home:'Argentina', hg:3, away:'France', ag:3, winner:'Argentina', venue:'Lusail Final - PEN 4-2', status:'FT'},
  {home:'Croatia', hg:2, away:'Morocco', ag:1, winner:'Croatia', venue:'3rd Place', status:'FT'},
  {home:'France', hg:2, away:'Morocco', ag:0, winner:'France', venue:'Semi-Final', status:'FT'},
  {home:'Argentina', hg:3, away:'Croatia', ag:0, winner:'Argentina', venue:'Semi-Final', status:'FT'},
  {home:'England', hg:1, away:'France', ag:2, winner:'France', venue:'Quarter-Final', status:'FT'},
  {home:'Brazil', hg:1, away:'Croatia', ag:1, winner:'Croatia', venue:'Quarter-Final - PEN 4-2', status:'FT'},
  {home:'Japan', hg:2, away:'Spain', ag:1, winner:'Japan', venue:'Group Stage', status:'FT'},
  {home:'Germany', hg:1, away:'Japan', ag:2, winner:'Japan', venue:'Group Stage', status:'FT'},
];

const FLAGS = {Argentina:'ar',France:'fr',Brazil:'br',Croatia:'hr',Japan:'jp',Spain:'es',England:'gb-eng',Portugal:'pt',Germany:'de',Morocco:'ma',Netherlands:'nl',USA:'us',Senegal:'sn'}

function render(){
  document.getElementById('grid').innerHTML = MATCHES.map(m=>{
    const homeWin = m.winner===m.home, awayWin = m.winner===m.away;
    const hFlag = `https://flagcdn.com/w80/${FLAGS[m.home]||'un'}.png`;
    const aFlag = `https://flagcdn.com/w80/${FLAGS[m.away]||'un'}.png`;
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:11px;opacity:.6"><span>${m.venue}</span><span>${m.status}</span></div>
      <div class="score-row">
        <div class="team ${homeWin?'winner':''}"><div class="crown">👑</div><div class="logo"><img src="${hFlag}"></div><div style="margin-top:6px;font-weight:700">${m.home}</div><div style="font-size:11px;opacity:.6">ยิง ${m.hg} ลูก</div></div>
        <div style="text-align:center"><span class="goals ${homeWin?'winner':''}">${m.hg}</span><span style="opacity:.3"> : </span><span class="goals ${awayWin?'winner':''}">${m.ag}</span></div>
        <div class="team ${awayWin?'winner':''}"><div class="crown">👑</div><div class="logo"><img src="${aFlag}"></div><div style="margin-top:6px;font-weight:700">${m.away}</div><div style="font-size:11px;opacity:.6">ยิง ${m.ag} ลูก</div></div>
      </div>
    </div>`;
  }).join('');
}
render();
</script>
</body>
</html>
